<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Back to Yip</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0d0c; color: #ede8e3; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; border-radius: 12px; background: #f28c28; color: #1a1004; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Signed in</h1>
  <p>If Yip didn't open by itself, tap below.</p>
  <a id="open" href="#">Open Yip</a>
</main>
<script>
  // Normally Android hands this URL straight to the app (App Links) and this page never shows.
  // Fallback: pass the token on via an intent URL. The fragment never leaves the device.
  (function () {
    var params = location.hash.slice(1);
    if (!params) return;
    var url = "intent://yipchat.dev/auth?" + params + "#Intent;scheme=https;package=dev.yipchat;end";
    document.getElementById("open").href = url;
    history.replaceState(null, "", location.pathname);
    location.href = url;
  })();
</script>
</body>
</html>

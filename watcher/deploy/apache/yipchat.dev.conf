# OAuth return page + Android App Links verification. certbot --apache -d yipchat.dev
<VirtualHost *:443>
    ServerName yipchat.dev
    DocumentRoot /var/www/yipchat.dev

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/yipchat.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yipchat.dev/privkey.pem

    <Directory /var/www/yipchat.dev>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Android requires this exact path, served as JSON, with no redirects.
    <Directory /var/www/yipchat.dev/.well-known>
        Require all granted
    </Directory>
    <Files "assetlinks.json">
        Header set Content-Type "application/json"
    </Files>

    # The auth and import pages receive data in the URL fragment. Fragments never reach the
    # server, but keep it out of referrers and caches anyway.
    <Location /auth>
        Header set Referrer-Policy "no-referrer"
        Header set Cache-Control "no-store"
        Header set Content-Security-Policy "default-src 'none'; script-src 'sha256-2pyXqMJ/L6luTyxIImhU2AYseVuZTkATeVuPLHGcDEo='; style-src 'unsafe-inline'"
    </Location>

    <Location /import>
        Header set Referrer-Policy "no-referrer"
        Header set Cache-Control "no-store"
        Header set Content-Security-Policy "default-src 'none'; script-src 'sha256-IQWDqC+WdFXdcGFhJL4p1g6dIrGCN58XwiDmZCghLdc='; style-src 'unsafe-inline'"
    </Location>

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
</VirtualHost>

<VirtualHost *:80>
    ServerName yipchat.dev
    Redirect permanent / https://yipchat.dev/
</VirtualHost>

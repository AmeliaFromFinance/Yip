# Serves the signed playback config. Get a certificate with: certbot --apache -d config.yipchat.dev
<VirtualHost *:443>
    ServerName config.yipchat.dev
    DocumentRoot /var/www/config.yipchat.dev

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/config.yipchat.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/config.yipchat.dev/privkey.pem

    <Directory /var/www/config.yipchat.dev>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Only the JSON is public; never serve dotfiles or temp files from atomic writes.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <Files "playback.json">
        Header set Cache-Control "public, max-age=300"
        Header set Content-Type "application/json; charset=utf-8"
    </Files>

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/config.yipchat.dev-error.log
    CustomLog ${APACHE_LOG_DIR}/config.yipchat.dev-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName config.yipchat.dev
    Redirect permanent / https://config.yipchat.dev/
</VirtualHost>

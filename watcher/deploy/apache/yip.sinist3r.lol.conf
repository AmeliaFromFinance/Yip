# OAuth return page + Android App Links verification. certbot --apache -d yip.sinist3r.lol
<VirtualHost *:443>
    ServerName yip.sinist3r.lol
    DocumentRoot /var/www/yip.sinist3r.lol

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/yip.sinist3r.lol/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yip.sinist3r.lol/privkey.pem

    <Directory /var/www/yip.sinist3r.lol>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Android requires this exact path, served as JSON, with no redirects.
    <Directory /var/www/yip.sinist3r.lol/.well-known>
        Require all granted
    </Directory>
    <Files "assetlinks.json">
        Header set Content-Type "application/json"
    </Files>

    # The auth and import pages receive data in the URL fragment. Fragments never reach the
    # server, but keep it out of referrers and caches anyway.
    <Location /auth>
        Header set Referrer-Policy "no-referrer"
        Header set Cache-Control "no-store"
        Header set Content-Security-Policy "default-src 'none'; script-src 'sha256-7V5cllLHwj+4toXPWJgU5obROBLUTGIZjyR7eWMQV2s='; style-src 'unsafe-inline'"
    </Location>

    <Location /import>
        Header set Referrer-Policy "no-referrer"
        Header set Cache-Control "no-store"
        Header set Content-Security-Policy "default-src 'none'; script-src 'sha256-EYxTv9zioVzc0xaNJwkvh0w7MhC5PFBUb7gx58kcFqg='; style-src 'unsafe-inline'"
    </Location>

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
</VirtualHost>

<VirtualHost *:80>
    ServerName yip.sinist3r.lol
    Redirect permanent / https://yip.sinist3r.lol/
</VirtualHost>

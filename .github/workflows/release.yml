name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Check secrets
        env:
          YIP_KEYSTORE_BASE64: ${{ secrets.YIP_KEYSTORE_BASE64 }}
          YIP_KEYSTORE_PASSWORD: ${{ secrets.YIP_KEYSTORE_PASSWORD }}
          YIP_KEY_ALIAS: ${{ secrets.YIP_KEY_ALIAS }}
          YIP_KEY_PASSWORD: ${{ secrets.YIP_KEY_PASSWORD }}
          YIP_TWITCH_CLIENT_ID: ${{ secrets.YIP_TWITCH_CLIENT_ID }}
          YIP_CONFIG_PUBLIC_KEY: ${{ secrets.YIP_CONFIG_PUBLIC_KEY }}
        run: |
          missing=""
          for name in YIP_KEYSTORE_BASE64 YIP_KEYSTORE_PASSWORD YIP_KEY_ALIAS YIP_KEY_PASSWORD YIP_TWITCH_CLIENT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          [ -n "$YIP_CONFIG_PUBLIC_KEY" ] || echo "::warning::YIP_CONFIG_PUBLIC_KEY is not set, so the app will use its built-in defaults."

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.YIP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yip.jks"
          echo "YIP_KEYSTORE_PATH=$RUNNER_TEMP/yip.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          YIP_KEYSTORE_PASSWORD: ${{ secrets.YIP_KEYSTORE_PASSWORD }}
          YIP_KEY_ALIAS: ${{ secrets.YIP_KEY_ALIAS }}
          YIP_KEY_PASSWORD: ${{ secrets.YIP_KEY_PASSWORD }}
          YIP_TWITCH_CLIENT_ID: ${{ secrets.YIP_TWITCH_CLIENT_ID }}
          YIP_CONFIG_PUBLIC_KEY: ${{ secrets.YIP_CONFIG_PUBLIC_KEY }}
          YIP_UPDATE_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(git rev-list --count HEAD)
          ./gradlew :app:assembleRelease -Pyip.versionName="$VERSION" -Pyip.versionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk "Yip-$VERSION.apk"
          sha256sum "Yip-$VERSION.apk" > "Yip-$VERSION.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/yip.jks"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            Yip-*.apk
            Yip-*.apk.sha256
          generate_release_notes: true

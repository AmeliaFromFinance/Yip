name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug --no-configuration-cache
      - name: Debug build
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/screenshots/
          retention-days: 7

  watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r watcher/requirements.txt
      - name: Sign and verify round trip
        run: |
          python watcher/yip_watcher.py keygen --key /tmp/k.pem
          python - <<'PY'
          import sys; sys.path.insert(0, "watcher")
          import yip_watcher as w
          from pathlib import Path
          k = w.load_private_key(Path("/tmp/k.pem"))
          env = w.sign_envelope({"version": 1}, k)
          assert w.open_envelope(env, w.public_key_b64(k)) == {"version": 1}
          PY
